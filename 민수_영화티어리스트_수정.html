<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민수의 영화 티어리스트</title>
<style>
:root{--bg:#f5f7ff;--ink:#20243b;--muted:#66708b;--line:#dce3f2;--s:#fa617d;--a:#ffb34e;--b:#57bca2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}.page{width:min(100%,1100px);margin:auto;padding:28px 18px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;color:#6974a8;margin:0 0 6px}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:0}.lead{color:var(--muted);margin:9px 0}.stat{background:white;border:1px solid var(--line);padding:9px 14px;border-radius:99px;margin:0;white-space:nowrap}.toolbar{display:flex;flex-wrap:wrap;gap:9px;background:white;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:23px}.toolbar input{min-width:0;flex:1 1 180px;background:#f2f5fd;border:1px solid transparent;padding:12px;border-radius:9px;font:inherit}.toolbar #poster{flex-basis:190px}.btn{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}.btn-primary{background:#343e80;color:white}.btn-ghost{background:#edf0fa;color:#35416c}#status{min-height:22px;margin:12px 3px 18px;color:var(--muted);font-size:14px}.instructions{margin:0 0 14px;color:#4e5a7d;font-size:14px}.pool{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.section-head button{border:0;background:none;color:#4353a1;text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}.zone{display:flex;flex-wrap:wrap;gap:10px;min-width:0;min-height:118px;align-content:flex-start;padding:12px;transition:background .15s}.zone.is-over{background:#eaf0ff}.zone:empty{align-items:center;justify-content:center}.zone:empty:before{content:"이곳에 영화가 없습니다";color:#8993ab;font-size:13px}.pool .zone{background:#f8faff;border:2px dashed #d5ddf0;border-radius:12px}.board{display:grid;gap:12px}.tier{display:flex;min-width:0;background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;min-height:142px}.tier-badge{flex:0 0 82px;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit}.tier-badge b{font-size:38px;line-height:1}.tier-badge span{font-size:12px;font-weight:700}.tier-S .tier-badge{background:var(--s)}.tier-A .tier-badge{background:var(--a);color:#4a310a}.tier-B .tier-badge{background:var(--b);color:#103d32}.tier .zone{flex:1}.card{width:105px;min-height:147px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:white;border:1px solid #dce3f1;border-radius:11px;box-shadow:0 2px 6px #1d275010;cursor:grab;touch-action:pan-y}.card.is-selected{outline:3px solid #4252a2;outline-offset:2px}.poster{height:96px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#c5d4ff,#ffd7e3);color:#47568a;font-size:31px;font-weight:900;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.card-title{font-size:12px;font-weight:750;line-height:1.25;overflow-wrap:anywhere;padding:7px 7px 4px;flex:1}.card select{width:calc(100% - 10px);margin:0 5px 6px;border:1px solid #d6deef;border-radius:6px;background:#f8faff;color:#29345a;font-size:12px;padding:5px 1px;cursor:pointer}.card.is-dragging{opacity:.4}:focus-visible{outline:3px solid #4050aa;outline-offset:2px}.footnote{font-size:12px;color:var(--muted);margin:12px 2px 0}
@media(max-width:520px){.page{padding:20px 10px 40px}.toolbar{padding:9px}.toolbar input{flex-basis:100%!important}.toolbar .btn{flex:1}.tier-badge{flex-basis:54px}.tier-badge b{font-size:28px}.tier-badge span{font-size:10px}.zone{padding:8px;gap:7px}.card{width:calc((100% - 14px)/3);min-width:0;min-height:128px}.poster{height:76px}.card-title{font-size:11px}.card select{font-size:11px}.pool{padding:10px}}
@media(max-width:340px){.card{width:calc((100% - 7px)/2)}}
</style></head><body><main class="page"><header><div><p class="eyebrow">MOVIE TIER LIST</p><h1>민수의 영화 티어리스트</h1><p class="lead">좋아하는 영화를 S·A·B 세 등급으로 나눠 보세요.</p></div><p class="stat" id="stat"></p></header>
<form class="toolbar" id="add-form"><input id="title" placeholder="영화 제목 (필수)" aria-label="영화 제목" maxlength="60" required><input id="poster" placeholder="포스터 이미지 주소 (선택)" aria-label="포스터 이미지 주소" type="url"><button class="btn btn-primary" type="submit">추가</button><button class="btn btn-ghost" type="button" id="reset">처음으로</button></form><p id="status" role="status" aria-live="polite">영화 아래의 등급 메뉴로 바로 이동할 수 있어요.</p><p class="instructions">영화 카드의 등급을 선택하거나, 카드를 선택한 뒤 등급 글자를 누르세요. 드래그도 가능합니다.</p>
<section class="pool" aria-label="아직 안 정한 영화"><div class="section-head"><h2>아직 안 정한 영화</h2><button id="to-pool" type="button">선택한 영화 되돌리기</button></div><div class="zone" id="pool"></div></section><section class="board" id="board" aria-label="영화 등급"></section><p class="footnote">변경 내용은 이 브라우저에 자동 저장됩니다. 브라우저의 사이트 데이터 삭제 또는 파일 주소 변경 시 저장 내용이 유지되지 않을 수 있습니다. 포스터는 이미지 주소를 입력했을 때 표시되며, 인터넷 연결이 필요할 수 있습니다.</p></main>
<script>
'use strict';
const MOVIES=['기생충','인터스텔라','라라랜드','센과 치히로의 행방불명','어벤져스: 엔드게임','범죄도시','타이타닉','토이 스토리'];
const TIERS=[{key:'S',caption:'최고'},{key:'A',caption:'좋음'},{key:'B',caption:'보통'}];
const KEY='minsu-movie-tierlist-v2';
const fresh=()=>({nextId:9,items:MOVIES.map((title,i)=>({id:'m'+(i+1),title,tier:'pool',poster:''}))});
const $=s=>document.querySelector(s);
const say=t=>{$('#status').textContent=t};
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();const data=JSON.parse(raw);if(!data||!Array.isArray(data.items))return fresh();const ids=new Set();const items=data.items.filter(x=>{if(!x||typeof x.id!=='string'||typeof x.title!=='string'||!x.title.trim()||ids.has(x.id))return false;ids.add(x.id);return true}).map(x=>({id:x.id,title:x.title.slice(0,60),tier:['S','A','B','pool'].includes(x.tier)?x.tier:'pool',poster:typeof x.poster==='string'?x.poster:''}));return{items,nextId:Math.max(9,Number.isSafeInteger(data.nextId)?data.nextId:9,...items.map(x=>Number(x.id.slice(1))||0).map(x=>x+1))}}catch(e){return fresh()}}
let state=load();let selected=null;let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(!saveWarned){say('저장할 수 없는 브라우저 환경입니다. 변경 내용이 유지되지 않을 수 있어요.');saveWarned=true}}}
function moveTo(id,tier){const item=state.items.find(x=>x.id===id);if(!item||!['S','A','B','pool'].includes(tier))return;item.tier=tier;selected=null;render();save();say(`‘${item.title}’ → ${tier==='pool'?'미분류':tier+'등급'} 이동 완료`)}
function makeCard(item){const card=document.createElement('div');card.className='card'+(selected===item.id?' is-selected':'');card.draggable=true;card.tabIndex=0;card.setAttribute('role','group');card.setAttribute('aria-label',item.title+' 영화 카드');const poster=document.createElement('div');poster.className='poster';poster.textContent='🎬';if(item.poster&&/^https?:\/\//i.test(item.poster)){const img=document.createElement('img');img.alt=item.title+' 포스터';img.loading='lazy';img.referrerPolicy='no-referrer';img.src=item.poster;img.onerror=()=>img.remove();poster.replaceChildren(img)}const name=document.createElement('div');name.className='card-title';name.textContent=item.title;const select=document.createElement('select');select.setAttribute('aria-label',item.title+' 등급 변경');for(const [key,label] of [['pool','미분류'],['S','S 등급'],['A','A 등급'],['B','B 등급']]){const option=document.createElement('option');option.value=key;option.textContent=label;select.append(option)}select.value=item.tier;select.addEventListener('change',e=>moveTo(item.id,e.target.value));select.addEventListener('click',e=>e.stopPropagation());card.addEventListener('click',e=>{if(e.target===select)return;selected=selected===item.id?null:item.id;render();say(selected?`‘${item.title}’ 선택됨. 등급 글자를 누르세요.`:'선택을 해제했어요.')});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===card){e.preventDefault();card.click()}});card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.id);e.dataTransfer.effectAllowed='move';card.classList.add('is-dragging')});card.addEventListener('dragend',()=>card.classList.remove('is-dragging'));card.append(poster,name,select);return card}
function dropZone(zone,tier){zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('is-over')});zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('is-over')});zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('is-over');moveTo(e.dataTransfer.getData('text/plain'),tier)})}
function render(){const board=$('#board');board.replaceChildren();for(const tier of TIERS){const row=document.createElement('div');row.className='tier tier-'+tier.key;const badge=document.createElement('button');badge.type='button';badge.className='tier-badge';const b=document.createElement('b');b.textContent=tier.key;const caption=document.createElement('span');caption.textContent=tier.caption;badge.append(b,caption);badge.setAttribute('aria-label',tier.key+' 등급에 놓기');badge.addEventListener('click',()=>selected?moveTo(selected,tier.key):say('먼저 영화를 선택하거나 카드의 등급 메뉴를 사용하세요.'));const zone=document.createElement('div');zone.className='zone';state.items.filter(x=>x.tier===tier.key).forEach(x=>zone.append(makeCard(x)));dropZone(zone,tier.key);row.append(badge,zone);board.append(row)}const pool=$('#pool');pool.replaceChildren(...state.items.filter(x=>x.tier==='pool').map(makeCard));const ranked=state.items.filter(x=>x.tier!=='pool').length;$('#stat').textContent=`${state.items.length}편 중 ${ranked}편 분류`}
dropZone($('#pool'),'pool');$('#to-pool').addEventListener('click',()=>selected?moveTo(selected,'pool'):say('먼저 영화 카드를 선택하세요.'));
$('#add-form').addEventListener('submit',e=>{e.preventDefault();const title=$('#title').value.trim();if(!title){say('영화 제목을 입력해 주세요.');$('#title').focus();return}const poster=$('#poster').value.trim();if(poster&&!/^https?:\/\//i.test(poster)){say('포스터 주소는 http:// 또는 https://로 시작해야 합니다.');return}state.items.push({id:'m'+state.nextId++,title,tier:'pool',poster});$('#title').value='';$('#poster').value='';render();save();say(`‘${title}’ 추가 완료`)});
$('#reset').addEventListener('click',()=>{if(!confirm('추가한 영화를 삭제하고 처음 8편을 모두 미분류로 되돌릴까요?'))return;state=fresh();selected=null;render();save();say('처음 영화 8편으로 돌아왔어요.')});render();
</script></body></html>
